<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln in the browser</title>
<style>
    :root { --bg: #fafafa; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --accent: #b4441b; --error: #c0392b; --warning: #9a6700; }
    @media (prefers-color-scheme: dark) {
        :root { --bg: #161617; --fg: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --accent: #ff8a5c; --error: #ff6b5e; --warning: #e3b341; }
    }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 16px; }
    textarea { box-sizing: border-box; width: 100%; height: 320px; padding: 12px; border: 1px solid var(--line); border-radius: 8px;
               background: transparent; color: var(--fg); font: 13px/1.5 ui-monospace, monospace; resize: vertical; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
    input, button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); }
    button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
    pre { margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; font: 13px/1.5 ui-monospace, monospace; }
    .error { color: var(--error); } .warning { color: var(--warning); }
    a { color: var(--accent); }
</style>
</head>
<body>
<main>
    <h1>Kiln, compiled in the browser</h1>
    <p>The Kiln compiler of <code>examples/kiln</code>, generated by Forge with <code>-t javascript</code>, compiles to a JVM class file in this page.</p>
    <textarea id="source" spellcheck="false" aria-label="Kiln source"></textarea>
    <div class="bar">
        <label>Class <input id="name" value="Hello" size="12"></label>
        <button id="compile">Compile</button>
        <span id="download"></span>
    </div>
    <pre id="output">Loading kiln.js...</pre>
</main>
<script type="module">
    // kiln.js is generated next to this page: forge -f ../kiln.forge -t javascript -d .
    import * as kiln from "./kiln.js";

    const source = document.getElementById("source");
    const output = document.getElementById("output");
    const download = document.getElementById("download");
    source.value = [
        "fun main() {",
        "    var i = 0",
        "    while i < 5 {",
        "        print(i * i)",
        "        i = i + 1",
        "    }",
        "}",
        "",
    ].join("\n");

    function line(text, cls) {
        const span = document.createElement("span");
        if (cls) span.className = cls;
        span.textContent = text + "\n";
        output.append(span);
    }

    function compile() {
        output.textContent = "";
        download.textContent = "";
        const name = document.getElementById("name").value.trim() || "Main";
        let result;
        try {
            result = kiln.compile(name, source.value);
        } catch (e) {
            if (e instanceof kiln.ParseException) return line(e.message, "error");
            throw e;
        }
        for (const d of result.diagnostics) {
            const severity = d.severity === kiln.Severity.ERROR ? "error" : "warning";
            line(`${d.line}:${d.column}: ${severity}: ${d.message}`, severity);
        }
        if (result.bytes === null) return line("no class file: there are errors", "error");
        const blob = new Blob([Uint8Array.from(result.bytes)], { type: "application/java-vm" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = name + ".class";
        link.textContent = "Download " + name + ".class";
        download.append(link);
        line(`${name}.class: ${result.bytes.length} bytes (run it with: java ${name})`);
    }

    document.getElementById("compile").addEventListener("click", compile);
    output.textContent = "Ready.";
</script>
</body>
</html>
